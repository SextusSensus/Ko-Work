# capture profile (P6.1b) -- a DATA-CAPTURE run for P7 (obs/action) + P8 (RGBD map/domains).
# It is demo-grade SAFE (this drives) PLUS it turns on the full recording bundle that demo/field leave
# off for loop-cost. Overlaid on defaults.yaml; CLI still overrides. Selecting it satisfies the
# fail-closed drive gate (require_heartbeat: true). Profile rules: never set drive/preview here, leave
# the 7 appearance floors null, unknown keys refuse to start.
#
# WHY a separate profile: pixels + depth record ONLY under --rerun (see docs/RUN_ARTIFACTS.md), which
# demo/field keep off. A P7/P8-usable run needs them ON. Use via run_follow_capture.sh (forces
# --profile capture) or the app's Rerun checkbox.
#
# LOOP-COST GATE (VERIFY ON ROBOT): --rerun + --drive adds loop cost; confirm the on-Orin loop-cost
# gate PASSES at this rerun_image_every_n before a real drive (RERUN_PLAN.md). Lower N = more P8
# fidelity + more cost; raise it if the gate is tight. rerun-sdk must be staged on the robot (the app's
# Rerun checkbox stages the wheels once) or the sink self-disables and no .rrd is written (follow still
# runs -- Rerun is never a safety dependency).

# --- safety (mirrors demo.yaml; keep in sync -- profiles don't stack) ---
require_heartbeat: true       # operator deadman mandatory (active-consent tether)
obstacle_brake: true          # depth forward-clearance reflex on (only ever reduces vx)
max_follow_range: 3.0         # geofence: stand if depth-range to target > 3.0 m
coast_frames: 6               # coast ~0.6 s (yaw-only) through brief occlusions
# 120 -> 0 == NO SESSION CAP (2026-09-10 operator: "rerun cuts way too short ... should have no
# limit and record until run ends"). The 120 s watchdog terminated every capture at 2 minutes and
# the .rrd closes with the session -- the 761 MB recording measured at ~6.3 MB/s is exactly 120 s,
# which is precisely what the operator was seeing. This profile EXISTS to collect data, so a
# 2-minute cap defeats its purpose. The run now ends when the operator stops it or the battery
# does. (0 is handled explicitly in run(): `max_seconds > 0 and elapsed >= max_seconds`, because a
# bare `elapsed >= 0` is true on the FIRST tick and would end the run instantly.)
#
# SAFETY, deliberately scoped two ways:
#  * Only THIS profile is unbounded. defaults.yaml (120), field.yaml (120) and demo.yaml (90) are
#    UNTOUCHED, so a normal follow still self-terminates at 2 minutes.
#  * An unbounded session while DRIVING is FAIL-CLOSED: parse_args refuses --drive with
#    max_seconds <= 0 unless --allow-untethered-unsafe is passed deliberately. So
#    run_follow_capture.sh drive will REFUSE to start with this profile until the operator opts in,
#    while a preview/controller run (no bridge -> velocity cannot be commanded at all) records
#    unbounded and free. Every other bound is unchanged: require_heartbeat above, the obstacle
#    brake, max_follow_range 3.0, the C++ staleness floor, and the hardware e-stop.
#
# DISK: ~6.3 MB/s at rerun_image_every_n 2 => ~23 GB/hour; offload_run.sh keeps the last 10
# bundles. 247 GB free measured 2026-09-10, so watch `df -h /home` on very long sessions.
max_seconds: 0.0
obstacle_target_margin: 0.4   # don't brake on the operator being followed

# --- recording bundle (the point of this profile) ---
rerun: true                   # record the .rrd (RGB + depth + scalars + P6.1 intrinsics)
rerun_mode: 'save'            # write a file (default; explicit here)
rerun_image_every_n: 2        # ~6.5 Hz RGB+depth on a ~13 Hz cam (vs 3 default) -- more P8 fidelity; gate it
odom_topic: '/odometer_state' # P6.1a planar odometry -> P8 trajectory prior (guarded; absent -> disabled)
