# MAP-CHANGE MANAGER (docs/MAP_CHANGE_PLAN.md) -- OBSERVATION ONLY, changes no decision.
# 'off' keeps the decision stream byte-identical; map-assist stays primary either way.
map_change: 'off'
map_change_stride: 5
map_change_min_votes: 8
map_change_min_parallax_deg: 25.0
map_change_min_prior_support: 3
map_change_report_s: 60.0
map_change_dir: '/home/booster/map_changes'
ground_corr: -0.60
ground_min_px: 500
obstacle_corridor_frac: 0.55
self_mask: ""
# 0.65 -> 0.75 (2026-09-10 field fix). MUST stay ABOVE obstacle_brake_stop (0.70), or the
# full-stop zone lands inside the band where the robot's OWN HANDS return. The URDF puts the
# hands at 0.67 m (see _corridor_clearance's height note), so at 0.65 they passed the self gate
# and landed at 0.65-0.68 -- i.e. below brake_stop 0.70 = instant vx=0. Measured live: clearance
# pinned at 0.65-0.68 with vx<=0.02 on 47% of frames, which starved forward motion, let the
# operator drift past 36 deg bearing (where k_yaw*bearing saturates vyaw_max) and left the robot
# railing yaw left/right instead of following. The graded brake (0.70..1.15) still works for real
# obstacles from 0.75 out; min_safe_range 0.60 and the C++ floor are untouched.
# PROPER FIX is a populated self-MASK (models/self_mask.npy is currently ALL-FALSE, so
# self_mask: "" is doing nothing) -- range alone cannot tell a hand at 0.67 from a chair at 0.67.
obstacle_self_range_m: 0.75
obstacle_max_m: 5.0
obstacle_memory_max_turn_deg: 25.0
obstacle_memory_s: 0.5
# 12 -> 115 (2026-09-10, from BRAKE-BLOB forensics). 12 px is 1.3 cm at 0.75 m -- speckle.
# The live log showed the brake stopping on 22-39 px blobs at the very bottom of the frame
# (v=406..443 of 448) at h=0.06..0.19 m, i.e. FLOOR pixels: 1.7-2.3 cm across. ground_reject
# cannot remove them because ground_min_px=500 skips anything "too small to classify safely",
# so they passed straight through as obstacles and pinned vx to 0.
# 115 px demands a 6 cm object at obstacle_brake_start (1.15 m, focal 205.8); anything nearer
# only projects larger. Real thin obstacles still clear it easily -- a 3 cm chair leg 40 cm
# tall is ~380 px, a 2 cm floor cable ~248 px -- so this rejects speckle, not furniture.
obstacle_min_blob_px: 115
obstacle_min_valid: 70
obstacle_pctile: 12.0
obstacle_target_margin: 0.4
