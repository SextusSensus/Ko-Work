# K1 follow node -- base configuration (P1.1, IMPLEMENTATION_README.md Phase 1).
#
# AUTHORITATIVE DEFAULTS for follow_person_k1.py. Generated from the pre-refactor
# argparse defaults (byte-identical values); the node loads this file, overlays an
# optional --profile <name|path> YAML, then CLI flags override everything (CLI wins).
# Keys are argparse dest names (underscores). The node REFUSES TO START if this file
# is missing or its key set does not exactly match the known config surface
# (fail-closed; see IMPLEMENTATION_README.md section 2).
#
# DO NOT set the 7 appearance-resolved floors to concrete values here or in profiles:
#   hiconf, anchor_floor, bank_floor, reloc_floor, reloc_view_floor,
#   reloc_iso_bypass_anchor, reloc_anchor_backstop
# They MUST stay null so the node's per-appearance resolution runs (global/striped/
# osnet use different similarity scales -- a baked value breaks lock stickiness).
#
# TUNE IN PROFILES (demo.yaml / field.yaml / dev.yaml), not here: this file mirrors
# the code's shipped defaults so `no profile` == today's behavior byte-for-byte.
